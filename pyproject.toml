[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meniscus"
version = "0.1.0"
description = "Local structured memory system for AI agents"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=2.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
vec = [
    "sqlite-vec>=0.1",
]
mcp = [
    "mcp[cli]>=1.27,<2",
]
all = [
    "meniscus[local-embedding,api,vec,mcp]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
men = "cli.main:cli"
men-mcp = "mcp_server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["api", "cli", "providers"]

[tool.hatch.build.targets.wheel.force-include]
"schema.sql" = "schema.sql"
"chunker.py" = "chunker.py"
"config.py" = "config.py"
"db.py" = "db.py"
"embedding_interface.py" = "embedding_interface.py"
"entity_extractor.py" = "entity_extractor.py"
"event_intake.py" = "event_intake.py"
"exceptions.py" = "exceptions.py"
"mcp_server.py" = "mcp_server.py"
"model_interface.py" = "model_interface.py"
"models.py" = "models.py"
"pipeline.py" = "pipeline.py"
"retrieval.py" = "retrieval.py"
"startup.py" = "startup.py"
"thread_assigner.py" = "thread_assigner.py"
"thread_summarizer.py" = "thread_summarizer.py"
"time_bounds.py" = "time_bounds.py"
"meniscus_types.py" = "meniscus_types.py"
"vocab_reconciliation.py" = "vocab_reconciliation.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
