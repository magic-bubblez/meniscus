[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meniscus"
version = "0.1.0"
description = "Local structured memory system for AI agents"
readme = "README.md"
authors = [{ name = "magic_bubblez" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers>=2.0",
]
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]
vec = [
    "sqlite-vec>=0.1",
]
mcp = [
    "mcp[cli]>=1.27,<2",
]
all = [
    "meniscus[local-embedding,api,vec,mcp]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
men = "meniscus.cli.main:cli"
men-mcp = "meniscus.mcp_server:mcp.run"

[project.urls]
Homepage = "https://github.com/magic-bubblez/meniscus"
Repository = "https://github.com/magic-bubblez/meniscus"

[tool.hatch.build.targets.wheel]
packages = ["meniscus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
